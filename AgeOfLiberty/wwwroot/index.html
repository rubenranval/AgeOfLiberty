<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Age Of Liberty</title>
    <base href="/" />
    <!-- Paint dark before app.css resolves: kills the white flash on cold
         launch, when the WebView is up but nothing has rendered yet. -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #04070d;
        }

        @keyframes aolBootSweep {
            from {
                left: -45%;
            }

            to {
                left: 100%;
            }
        }
    </style>
    <link href="app.css" rel="stylesheet" />
</head>
<body>
    <!-- The loader carries inline styles as well as its app.css classes, so it
         paints correctly on the very first frame even before the stylesheet
         resolves. Blazor replaces the contents of #app when it renders, so
         this disappears on its own — no removal logic, nothing to get stuck. -->
    <div id="app">
        <div class="load-screen" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04070d;">
            <div class="load-core" style="display:flex;flex-direction:column;align-items:center;gap:22px;">
                <div class="load-mark" style="font-family:Cinzel,Georgia,serif;font-size:15px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:rgba(240,208,128,0.85);">Age of Liberty</div>
                <div class="load-bar" style="width:190px;height:1px;position:relative;overflow:hidden;background:rgba(120,190,255,0.14);">
                    <div class="load-bar-fill" style="position:absolute;top:0;bottom:0;width:42%;background:linear-gradient(90deg,transparent,rgba(74,216,255,0.9),transparent);animation:aolBootSweep 1.5s cubic-bezier(0.45,0,0.55,1) infinite;"></div>
                </div>
                <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(159,216,240,0.55);">Initialising simulation</div>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="lib/three.min.js"></script>
    <script src="lib/gltfloader.js"></script>
    <!-- audio-bus MUST load before anything constructs an Audio object: it
         patches window.Audio so every sound routes through a Web Audio gain
         node. iOS ignores HTMLMediaElement.volume entirely. -->
    <script src="audio-bus.js"></script>
    <script src="animations2.js"></script>
    <script src="ambient.js"></script>
    <script src="juice.js"></script>
    <script src="era-chest.js"></script>
    <script src="intro.js"></script>
    <script src="intro-music.js"></script>
    <script src="badge.js"></script>
    <script>
        window.addEventListener('load', function () {
            setTimeout(function () { Blazor.start(); }, 200);
        });
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" />
</body>
</html>
